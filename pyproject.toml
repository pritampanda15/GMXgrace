[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gmxgrace"
version = "0.1.0"
description = "Publication-quality GROMACS plotting suite — modern Python CLI, API, and online Web Studio replacement for xmgrace (Academic Non-Commercial License)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Pritam Kumar Panda", email = "pritampkp15@gmail.com" }
]
keywords = ["gromacs", "xmgrace", "molecular-dynamics", "plotting", "publication-figures", "xvg", "xpm", "edr", "ramachandran"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/pritampanda15/GMXgrace"
Repository = "https://github.com/pritampanda15/GMXgrace"
Issues = "https://github.com/pritampanda15/GMXgrace/issues"

[project.optional-dependencies]
edr = [
    "panedr>=0.8",
    "pandas>=2.0",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
gmxgrace = "gmxgrace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gmxgrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
